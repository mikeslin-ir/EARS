[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ears-video"
version = "0.1.0"
description = "Evidence-aware frame retrieval for budgeted video reasoning"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Shih-Yao (Mike) Lin", email = "mikeslin.research@gmail.com"},
]
dependencies = [
  "numpy>=1.24.0",
  "opencv-python-headless>=4.5.0",
]

[project.urls]
Repository = "https://github.com/mikeslin-ir/EARS"

[project.scripts]
ears-select = "ears.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
